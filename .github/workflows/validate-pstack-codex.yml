name: Validate pstack for Codex

on:
  pull_request:
    paths:
      - "pstack-codex/**"
      - "pstack/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/validate-pstack-codex.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Validate package and unchanged Cursor resources
        run: python3 pstack-codex/scripts/validate.py
      - name: Test Codex helpers
        run: python3 -m unittest discover -s pstack-codex/tests -v
      - name: Install locked workflow helper dependencies
        working-directory: pstack-codex/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Test workflow helpers
        working-directory: pstack-codex/skills/poteto-mode/scripts
        run: bun test watch-pr check-plan.test.ts
      - name: Check workflow helper types
        working-directory: pstack-codex/skills/poteto-mode/scripts
        run: bun run typecheck
      - name: Install statechart test dependencies
        working-directory: pstack-codex/skills/statechart/scripts
        run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Fetch checksum-pinned TLC
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools.jar
        run: |
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$TLC_JAR"
          printf '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  %s\n' "$TLC_JAR" | sha256sum --check
      - name: Test statechart compiler and replay fixtures
        working-directory: pstack-codex/skills/statechart/scripts
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          XDG_CACHE_HOME: ${{ runner.temp }}/pstack-statechart-cache
          npm_config_cache: ${{ runner.temp }}/pstack-npm-cache
        run: node --disable-warning=ExperimentalWarning --test test/*.test.ts
