schema_version: 2

# Dormant example. Complete and validate all required adapter fields before a live run.
# Empty required fields are deliberate fail-closed placeholders.
runtime:
  event_adapter: ""
  execution_adapter: ""
  trigger_kind: "new-top-level-slack-report"
  trigger_fields: ["source_channel_id", "ts", "thread_ts"]
  timestamps_are_strings: true
  require_authenticated_event: true
  require_per_report_serialisation: true
  # Thread polling waits inside an event-triggered run; it is not new-report discovery.
  allow_scheduled_report_polling: false
  worker_slack_isolation_verified: false
  adapter_parity_verified: false

automations:
  triage_name: "benny-triage"
  reproduce_name: "benny-reproduce"
  triage_id: ""
  reproduce_id: ""

slack:
  source_channel_id: "SOURCE_CHANNEL_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  read_action: "configured-slack-read-action"
  thread_post_action: "configured-slack-thread-post-action"
  file_download_action: "configured-slack-file-download-action"
  operations_edit_action: "configured-slack-edit-action"
  prefer_configured_actions: true
  optional_bot_token_env: "BENNY_SLACK_BOT_TOKEN"
  allow_source_root_posts: false
  allow_worker_slack_writes: false

repository:
  url: "https://github.com/example-org/example-repo"
  default_branch: "main"
  pull_request_action: "configured-draft-pull-request-action"
  pull_request_url_format: "https://github.com/{owner}/{repo}/pull/{number}"
  draft_only: true

tracker:
  type: "linear"
  adapter_skill_name: "issue-tracker-adapter-placeholder"
  team: "team-placeholder"
  project: "project-placeholder"
  labels:
    bug: "bug-label-placeholder"
    performance: "performance-label-placeholder"
    intake: "intake-label-placeholder"
    needs_repro: "needs-repro-label-placeholder"
  status: "intake-status-placeholder"
  source_link_title: "Slack report"
  require_compensation_action: true

routing:
  map_path: ".agents/benny/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  skill_name: "control-target-app"
  feature_map_path: ".agents/benny/feature-map.md"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "/tmp/benny-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[benny:bug]"
  performance: "[benny:performance]"
  other: "[benny:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  poll_seconds: 45 # Existing source/operations thread waits only; never report discovery.
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

# Use only models and effort values reported available by the execution adapter.
# Fill each role explicitly. No Cursor or external-provider defaults are assumed.
models:
  triage:
    model: ""
    reasoning_effort: ""
  reproduce:
    model: ""
    reasoning_effort: ""
  code:
    model: ""
    reasoning_effort: ""
  media_review:
    model: ""
    reasoning_effort: ""
